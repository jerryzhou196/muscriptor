; Stable HTTPS connector for the MuScriptor API. Installed only when
; /workspace/.cloudflared-token exists; the tunnel route is configured in the
; Cloudflare dashboard.

[program:muscriptor_named_tunnel]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/muscriptor-tunnel.sh
autostart=true
autorestart=unexpected
startsecs=5
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
