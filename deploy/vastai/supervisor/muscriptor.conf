; Supervisor program definition for the muscriptor transcription server.
; Installed to /etc/supervisor/conf.d/muscriptor.conf by setup.sh, then loaded
; with `supervisorctl reread && supervisorctl update`.
;
; Modelled on the image's own /etc/supervisor/conf.d/tensorboard.conf so that
; the service behaves like a first-class one in the instance portal.

[program:muscriptor]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/muscriptor.sh

; Start on boot so a stop/start of the instance brings the API back without a
; manual step. Note this does NOT survive `recycle` or `destroy` — those rebuild
; the container from the image and wipe /etc entirely. See README.md.
autostart=true

; `unexpected` (not `true`): restart on a crash, but respect a deliberate
; `supervisorctl stop muscriptor`.
autorestart=unexpected

; Model load is slow on a cold HF cache (~1.1 GB of weights). Give the process
; room to come up before supervisor decides the start failed.
startsecs=30
stopwaitsecs=30

; Required so the logs reach /var/log/portal and the Vast instance portal.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
